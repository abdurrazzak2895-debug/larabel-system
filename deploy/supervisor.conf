; SVP Takamol — Supervisor worker configuration
; Place in /etc/supervisor/conf.d/takamol.conf

[program:takamol-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/takamol/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/takamol/storage/logs/worker.log
stopwaitsecs=3600

[program:takamol-scheduler]
command=php /var/www/takamol/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/takamol/storage/logs/scheduler.log
